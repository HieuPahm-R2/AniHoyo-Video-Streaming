# AniHoyo virtual host: static SPA + reverse proxy to the Spring Boot backend.
#
# Everything is served from a single origin, so the browser never issues a
# cross-origin request. The backend CORS allow-list only contains the Vite dev
# origins (localhost:3000/4173/5173), therefore the SPA is built with an empty
# VITE_BACKEND_URL and talks to the API through this proxy.

upstream anihoyo_backend {
    server backend:8083;
    keepalive 32;
}

# SeaweedFS filer HTTP API. The S3 gateway (seaweedfs:8333) requires signed
# requests once credentials are configured, so the public read path goes
# through the filer, which exposes buckets under /buckets/<bucket>/.
upstream anihoyo_seaweedfs {
    server seaweedfs:8888;
    keepalive 16;
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------- SPA ----
    # Vite emits content-hashed filenames under /assets, safe to cache forever.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The shell must never be cached, otherwise clients keep an old bundle.
    # try_files issues an internal redirect, so this exact-match location also
    # covers requests for "/" and every deep link.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Client-side routing fallback (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------- REST API ----
    location /api/ {
        include /etc/nginx/snippets/proxy_headers.conf;
        proxy_pass http://anihoyo_backend;
        # Stream large multipart uploads straight through instead of buffering
        # a 1GB body to disk inside the nginx container first.
        proxy_request_buffering off;
    }

    # --------------------------------------------------- Video streaming ----
    # Byte-range playback endpoint: no buffering, and Range must reach Spring.
    location /api/v1/stream/ {
        include /etc/nginx/snippets/proxy_headers.conf;
        proxy_pass http://anihoyo_backend;
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_set_header        Range     $http_range;
        proxy_set_header        If-Range  $http_if_range;
        add_header              Accept-Ranges bytes always;
    }

    # HLS manifests / segments: /api/v1/{id}/master.m3u8,
    # /api/v1/{id}/{quality}/index.m3u8, /api/v1/{id}/{quality}/{segment}.ts
    # With R2_HLS_RELAY=true (default) the backend streams the objects out of R2,
    # so this block just proxies the bytes; with R2_HLS_RELAY=false it answers
    # 302 -> https://media.108pog.site and nginx only relays the redirect.
    location ~ ^/api/v1/[0-9]+/ {
        include /etc/nginx/snippets/proxy_headers.conf;
        proxy_pass http://anihoyo_backend;
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_set_header        Range     $http_range;
        proxy_set_header        If-Range  $http_if_range;
        # Playlists/segments are versioned by content hash; never cache the
        # indirection through this API.
        proxy_hide_header       Cache-Control;
        add_header              Cache-Control "no-store" always;
    }

    # -------------------------------------------------- Local static media ----
    # GET /storage/** is served by Spring, which now streams the object out of
    # SeaweedFS (MediaController) and falls back to the local /uploads volume
    # for assets that predate the migration. URLs are unchanged.
    location /storage/ {
        include /etc/nginx/snippets/proxy_headers.conf;
        proxy_pass http://anihoyo_backend;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # --------------------------------------------------- SeaweedFS objects ----
    # Anonymous read of the image bucket straight from SeaweedFS, bypassing the
    # backend. This is the scale-out path for large objects (HLS segments) and
    # is handy for verifying the bucket by hand; the SPA does not depend on it.
    #
    # NOTE: the bucket name here must match SEAWEEDFS_BUCKET in .env.
    location /media/ {
        include /etc/nginx/snippets/proxy_headers.conf;
        proxy_pass http://anihoyo_seaweedfs/buckets/anihoyo-media/;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # ------------------------------------------------------ WebSocket/STOMP ----
    # SockJS endpoint: /ws/info, /ws/{server}/{session}/websocket,
    # /ws/{server}/{session}/xhr_streaming, ...
    location /ws {
        include /etc/nginx/snippets/proxy_headers.conf;
        proxy_pass http://anihoyo_backend;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection $connection_upgrade;
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ------------------------------------------------------------- Swagger ----
    # Spring Security permits /v3/api-docs/** and /swagger-ui/** publicly.
    location /v3/               { include /etc/nginx/snippets/proxy_headers.conf; proxy_pass http://anihoyo_backend; }
    location /swagger-ui/       { include /etc/nginx/snippets/proxy_headers.conf; proxy_pass http://anihoyo_backend; }
    location = /swagger-ui.html { include /etc/nginx/snippets/proxy_headers.conf; proxy_pass http://anihoyo_backend; }
    location /webjars/          { include /etc/nginx/snippets/proxy_headers.conf; proxy_pass http://anihoyo_backend; }

    # -------------------------------------------------------------- Health ----
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
