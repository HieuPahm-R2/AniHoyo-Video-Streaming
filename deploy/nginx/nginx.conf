# AniHoyo - Nginx web server + reverse proxy
# Serves the built React SPA and proxies API / media / WebSocket traffic to Spring Boot.
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # The backend accepts uploads up to 1000MB (spring.servlet.multipart.max-file-size).
    # Nginx must allow at least the same, otherwise it rejects the request with 413.
    client_max_body_size  1024m;
    client_body_timeout   600s;
    client_body_buffer_size 1m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    # NOTE: video/mp2t (.ts) is deliberately absent -> segments stay uncompressed
    # so that HTTP range requests and CDN caching keep working.
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/vnd.apple.mpegurl image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Long-lived defaults: HLS transcoding runs synchronously inside
    # POST /api/v1/add-episode, so a request can legitimately take many minutes.
    # Proxy headers live in snippets/proxy_headers.conf and are included by each
    # location (nginx drops inherited proxy_set_header as soon as a location
    # declares one of its own).
    proxy_http_version    1.1;
    proxy_connect_timeout 30s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;

    include /etc/nginx/conf.d/*.conf;
}
