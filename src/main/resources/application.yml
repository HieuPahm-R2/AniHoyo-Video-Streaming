spring:
  # Spring Boot has no native .env support, so the file is pulled in as a properties
  # document: KEY=VALUE is exactly the .env format, and the [.properties] hint
  # tells Boot how to parse it. 
  # Optional on purpose: inside a container the file does not exist and the
  # values arrive as real environment variables (R2_*, SEAWEEDFS_*, ...).
  config:
    import: optional:file:../.env[.properties]
  profiles:
    active: dev
  application:
    name: AniHoyo
  jpa:
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 1000MB
  data:
    redis:
      database: 0
      timeout: 60000
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

anihoyo:
  views:
    flush-interval-ms: ${VIEW_FLUSH_INTERVAL_MS:300000}
    deduplication-hours: ${VIEW_DEDUPLICATION_HOURS:24}
    cookie-secure: ${VIEW_COOKIE_SECURE:false}
  jwt:
    access-token-validity-in-seconds: 8640
    refresh-token-validity-in-seconds: 864000
    # Token vừa bị xoay vẫn dùng được thêm bao lâu (2 tab refresh cùng lúc).
    refresh-grace-seconds: ${JWT_REFRESH_GRACE_SECONDS:60}
    # Giữ dòng đã thu hồi/hết hạn bao lâu trong refresh_tokens trước khi dọn.
    refresh-retention-hours: ${JWT_REFRESH_RETENTION_HOURS:24}
    # Cron dọn bảng refresh_tokens.
    refresh-cleanup-cron: "${JWT_REFRESH_CLEANUP_CRON:0 30 3 * * *}"

server:
  port: 8083

storage:
  r2:
    enabled: ${R2_ENABLED:false}
    account-id: ${R2_ACCOUNT_ID:}
    endpoint: ${R2_ENDPOINT:}
    # Credentials come from the .env file (or the R2_* environment variables in
    # a container). See spring.config.import above for the local case.
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    source-bucket: ${R2_SOURCE_BUCKET:anihoyo-source}
    media-bucket: ${R2_MEDIA_BUCKET:anihoyo-media}
    public-base-url: ${R2_PUBLIC_BASE_URL:https://media.108pog.site}
    hls-prefix: ${R2_HLS_PREFIX:hls}
    # true  = API tự stream HLS (cùng origin với SPA, không cần CORS trên bucket).
    # false = trả 302 sang CDN; khi đó bucket phải có CORS policy cho origin của SPA.
    hls-relay: ${R2_HLS_RELAY:true}
  # Images only (poster/thumbnail/avatar/slider). Videos stay on R2.
  seaweedfs:
    enabled: ${SEAWEEDFS_ENABLED:false}
    endpoint: ${SEAWEEDFS_ENDPOINT:http://localhost:8333}
    access-key-id: ${SEAWEEDFS_ACCESS_KEY_ID:}
    secret-access-key: ${SEAWEEDFS_SECRET_ACCESS_KEY:}
    bucket: ${SEAWEEDFS_BUCKET:anihoyo-media}
    region: ${SEAWEEDFS_REGION:us-east-1}
    # Serve objects uploaded before the migration from the local volume.
    fallback-to-local: ${SEAWEEDFS_FALLBACK_TO_LOCAL:true}
